name: Build Life Zero v0.1 APK

on:
  push:
    branches: [ life-zero-build ]
    paths:
      - 'life_zero_v02/**'
      - '.github/workflows/build-web-v16-stable-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Cache Life Zero signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: life-zero-signing-v1

      - name: Prepare game assets
        shell: bash
        run: |
          rm -rf android-web/app/src/main/assets
          mkdir -p android-web/app/src/main/assets
          base64 -d life_zero_v02/index.html.gz.b64 | gzip -d > android-web/app/src/main/assets/index.html
          echo "7bce69a26f3d3dc0bafda7c4275f7e1568482536a49df16efd9810ef9141ef69  android-web/app/src/main/assets/index.html" | sha256sum -c -
          grep -q 'Жизнь с нуля v0.1' android-web/app/src/main/assets/index.html

      - name: Configure Life Zero app
        shell: bash
        run: |
          cat > android-web/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="Жизнь с нуля"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity
                      android:name="com.geodenix.deepmine.MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenLayout|screenSize|smallestScreenSize|uiMode"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android-web/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.geodenix.deepmine'
              compileSdk 35

              defaultConfig {
                  applicationId "com.geodenix.lifezero"
                  minSdk 24
                  targetSdk 35
                  versionCode 2
                  versionName "0.1"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-web
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/LifeZero-v0.1.apk

      - name: Verify APK
        working-directory: android-web
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/LifeZero-v0.1.apk"
          test -s "$APK"
          unzip -p "$APK" assets/index.html | grep -q 'Жизнь с нуля v0.1'
          /usr/local/lib/android/sdk/build-tools/35.0.1/aapt dump badging "$APK" | grep "package: name='com.geodenix.lifezero'" | grep "versionCode='2'" | grep "versionName='0.1'"
          VERIFY="$("/usr/local/lib/android/sdk/build-tools/35.0.1/apksigner" verify --verbose --print-certs "$APK")"
          echo "$VERIFY"
          echo "$VERIFY" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeZero-v0.1-APK
          path: android-web/app/build/outputs/apk/debug/LifeZero-v0.1.apk
          if-no-files-found: error
          retention-days: 30
