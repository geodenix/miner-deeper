name: Build Night Courier v0.1 APK

on:
  push:
    branches: [ night-courier-build ]
    paths:
      - 'night_courier_v01/**'
      - '.github/workflows/build-web-v16-stable-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Prepare game assets
        shell: bash
        run: |
          rm -rf android-web/app/src/main/assets
          mkdir -p android-web/app/src/main/assets
          base64 -d night_courier_v01/index.html.gz.b64 | gzip -d > android-web/app/src/main/assets/index.html
          echo "e606a962906d3cda41cf22c611827e870d01d0e6f198fbdb8cc6fa4546812a96  android-web/app/src/main/assets/index.html" | sha256sum -c -
          grep -q 'Ночной Курьер v0.1' android-web/app/src/main/assets/index.html

      - name: Configure Night Courier app
        shell: bash
        run: |
          cat > android-web/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="Night Courier"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name="com.geodenix.deepmine.MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenLayout|screenSize|smallestScreenSize|uiMode"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android-web/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.geodenix.deepmine'
              compileSdk 35

              defaultConfig {
                  applicationId "com.geodenix.nightcourier"
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName "0.1"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-web
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/NightCourier-v0.1-FIX.apk

      - name: Verify APK
        working-directory: android-web
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/NightCourier-v0.1-FIX.apk"
          test -s "$APK"
          unzip -p "$APK" assets/index.html | grep -q 'Ночной Курьер v0.1'
          /usr/local/lib/android/sdk/build-tools/35.0.1/aapt dump badging "$APK" | grep "package: name='com.geodenix.nightcourier'" | grep "versionCode='1'" | grep "versionName='0.1'"
          VERIFY="$("/usr/local/lib/android/sdk/build-tools/35.0.1/apksigner" verify --verbose --print-certs "$APK")"
          echo "$VERIFY"
          echo "$VERIFY" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NightCourier-v0.1-FIX-APK
          path: android-web/app/build/outputs/apk/debug/NightCourier-v0.1-FIX.apk
          if-no-files-found: error
          retention-days: 30
