name: Build Deep Mine v1.2 FIXED APK

on:
  push:
    branches: [ apk-build-v10 ]
    paths:
      - 'webapp_v12/**'
      - '.github/workflows/build-web-v12-fixed-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Restore original v1.1 signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: deep-mine-web-debug-signing-v1

      - name: Verify original signing key
        shell: bash
        run: |
          test -s "$HOME/.android/debug.keystore"
          KEYINFO="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey)"
          echo "$KEYINFO"
          echo "$KEYINFO" | tr -d ':' | grep -qi '031851EBA6924D28217612BF4FBBE377AFD88D374AE718907424A07ABB1CF16E'

      - name: Rebuild Deep Mine v1.2
        shell: bash
        run: |
          rm -rf /tmp/dm12fix
          mkdir -p /tmp/dm12fix/_v09_cmp

          cat webapp_v09/smallpart* > /tmp/v09.b64
          base64 -d /tmp/v09.b64 > /tmp/v09.zip
          echo "973d7f59475f589bbd01a605b4294f97fa91e8560779c73861783ac0d6720183  /tmp/v09.zip" | sha256sum -c -
          unzip -q /tmp/v09.zip -d /tmp/dm12fix/_v09_cmp
          cp -a /tmp/dm12fix/_v09_cmp/deep_mine_v09 /tmp/dm12fix/deep_mine_v10

          cat webapp_v10/fix0 webapp_v10/fix1 webapp_v10/fix2 webapp_v10/fix3s0 webapp_v10/fix3s1 webapp_v10/fix3s2 webapp_v10/fix3s3 webapp_v10/v10.patch.gz.b64.part01 > /tmp/v10.b64
          base64 -d /tmp/v10.b64 | gzip -d > /tmp/v10.patch
          sed 's#_v09_cmp/deep_mine_v09/#deep_mine_v10/#g' /tmp/v10.patch > /tmp/v10.apply
          cd /tmp/dm12fix
          patch -p0 < /tmp/v10.apply

          cp -a deep_mine_v10 deep_mine_v11
          base64 -d "$GITHUB_WORKSPACE/webapp_v11/v11.patch.gz.b64" | gzip -d > /tmp/v11.patch
          sed 's#_v10_cmp/deep_mine_v10/#deep_mine_v11/#g' /tmp/v11.patch > /tmp/v11.apply
          patch -p0 < /tmp/v11.apply

          cp -a deep_mine_v11 deep_mine_v12
          base64 -d "$GITHUB_WORKSPACE/webapp_v12/v12.patch.gz.b64" | gzip -d > /tmp/v12.patch
          echo "b6b106fdac8c336f9afc8b821ec7cf0e0c249f2e42bc25d5ac37e1f02db466f4  /tmp/v12.patch" | sha256sum -c -
          sed 's#_v11_cmp/deep_mine_v11/#deep_mine_v12/#g' /tmp/v12.patch > /tmp/v12.apply
          patch -p0 < /tmp/v12.apply

          cd /tmp/dm12fix/deep_mine_v12
          node --check game.js
          grep -q 'Deep Mine v1.2' index.html
          grep -q 'WORLD_CITIES' game.js
          grep -q 'sellToWorldCity' game.js

          cd "$GITHUB_WORKSPACE"
          rm -rf android-web/app/src/main/assets/*
          cp -a /tmp/dm12fix/deep_mine_v12/. android-web/app/src/main/assets/

      - name: Set Android v1.2
        shell: bash
        run: |
          sed -i 's/versionCode 10/versionCode 12/' android-web/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.2"/' android-web/app/build.gradle
          grep -q 'applicationId "com.geodenix.deepmine"' android-web/app/build.gradle
          grep -q 'versionCode 12' android-web/app/build.gradle
          grep -q 'versionName "1.2"' android-web/app/build.gradle

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build update APK
        working-directory: android-web
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/DeepMine-v1.2-fixed.apk

      - name: Verify package, version and original signature
        working-directory: android-web
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/DeepMine-v1.2-fixed.apk"
          test -s "$APK"
          unzip -p "$APK" assets/index.html | grep -q 'Deep Mine v1.2'
          /usr/local/lib/android/sdk/build-tools/35.0.1/aapt dump badging "$APK" | grep "package: name='com.geodenix.deepmine'" | grep "versionCode='12'" | grep "versionName='1.2'"
          CERT="$("/usr/local/lib/android/sdk/build-tools/35.0.1/apksigner" verify --print-certs "$APK")"
          echo "$CERT"
          echo "$CERT" | grep -qi '031851eba6924d28217612bf4fbbe377afd88d374ae718907424a07abb1cf16e'

      - name: Upload fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepMine-v1.2-FIXED-APK
          path: android-web/app/build/outputs/apk/debug/DeepMine-v1.2-fixed.apk
          if-no-files-found: error
          retention-days: 14
