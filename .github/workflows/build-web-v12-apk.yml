name: Build Deep Mine v1.2 APK

on:
  push:
    branches: [ apk-build-v12 ]
    paths:
      - 'webapp_v12/**'
      - '.github/workflows/build-web-v12-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: deep-mine-web-debug-signing-v1

      - name: Rebuild v1.2 web assets
        shell: bash
        run: |
          rm -rf /tmp/dm12
          mkdir -p /tmp/dm12/_v09_cmp

          cat webapp_v09/smallpart* > /tmp/v09.b64
          base64 -d /tmp/v09.b64 > /tmp/v09.zip
          echo "973d7f59475f589bbd01a605b4294f97fa91e8560779c73861783ac0d6720183  /tmp/v09.zip" | sha256sum -c -
          unzip -q /tmp/v09.zip -d /tmp/dm12/_v09_cmp
          cp -a /tmp/dm12/_v09_cmp/deep_mine_v09 /tmp/dm12/deep_mine_v10

          cat webapp_v10/fix0 webapp_v10/fix1 webapp_v10/fix2 webapp_v10/fix3s0 webapp_v10/fix3s1 webapp_v10/fix3s2 webapp_v10/fix3s3 webapp_v10/v10.patch.gz.b64.part01 > /tmp/v10.b64
          base64 -d /tmp/v10.b64 | gzip -d > /tmp/v10.patch
          sed 's#_v09_cmp/deep_mine_v09/#deep_mine_v10/#g' /tmp/v10.patch > /tmp/v10.apply
          cd /tmp/dm12
          patch -p0 < /tmp/v10.apply

          cp -a deep_mine_v10 deep_mine_v11
          base64 -d "$GITHUB_WORKSPACE/webapp_v11/v11.patch.gz.b64" | gzip -d > /tmp/v11.patch
          sed 's#_v10_cmp/deep_mine_v10/#deep_mine_v11/#g' /tmp/v11.patch > /tmp/v11.apply
          patch -p0 < /tmp/v11.apply

          cp -a deep_mine_v11 deep_mine_v12
          base64 -d "$GITHUB_WORKSPACE/webapp_v12/v12.patch.gz.b64" | gzip -d > /tmp/v12.patch
          echo "b6b106fdac8c336f9afc8b821ec7cf0e0c249f2e42bc25d5ac37e1f02db466f4  /tmp/v12.patch" | sha256sum -c -
          sed 's#_v11_cmp/deep_mine_v11/#deep_mine_v12/#g' /tmp/v12.patch > /tmp/v12.apply
          patch -p0 < /tmp/v12.apply

          cd /tmp/dm12/deep_mine_v12
          echo "b8cd5648baf74169bf80eb83a2360161a5a6b01050369562f4f043a09891a613  index.html" | sha256sum -c -
          echo "7b8bde2005753003f4d2e3b0566068e55f3ea78c8494aaeade3c7f31fce3ad56  style.css" | sha256sum -c -
          echo "e27d11093b8a7c3ffdb9cbdfc5b5fab0969b741c110b1524b03a89e8d4111192  game.js" | sha256sum -c -
          node --check game.js
          grep -q 'Deep Mine v1.2' index.html
          grep -q 'WORLD_CITIES' game.js

          cd "$GITHUB_WORKSPACE"
          rm -rf android-web/app/src/main/assets/*
          cp -a /tmp/dm12/deep_mine_v12/. android-web/app/src/main/assets/

      - name: Version 1.2
        shell: bash
        run: |
          sed -i 's/versionCode 10/versionCode 12/' android-web/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.2"/' android-web/app/build.gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-web
        run: |
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/DeepMine-v1.2-update.apk

      - name: Verify APK
        working-directory: android-web
        run: |
          APK="app/build/outputs/apk/debug/DeepMine-v1.2-update.apk"
          test -s "$APK"
          unzip -p "$APK" assets/index.html | grep -q 'Deep Mine v1.2'
          unzip -p "$APK" assets/game.js | grep -q 'sellToWorldCity'
          /usr/local/lib/android/sdk/build-tools/35.0.1/apksigner verify "$APK"
          /usr/local/lib/android/sdk/build-tools/35.0.1/aapt dump badging "$APK" | grep "versionCode='12'" | grep "versionName='1.2'"

      - uses: actions/upload-artifact@v4
        with:
          name: DeepMine-v1.2-update-APK
          path: android-web/app/build/outputs/apk/debug/DeepMine-v1.2-update.apk
          retention-days: 14
