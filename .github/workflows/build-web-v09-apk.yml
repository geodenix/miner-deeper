name: Build Deep Mine v0.9 APK

on:
  push:
    branches: [ apk-build-v09 ]
    paths:
      - 'android-web/**'
      - 'webapp_v09/**'
      - '.github/workflows/build-web-v09-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: deep-mine-web-debug-signing-v1

      - name: Create debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Deep Mine Debug,O=geodenix,C=RU"               -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Restore Deep Mine v0.9 web files
        shell: bash
        run: |
          cat webapp_v09/smallpart* > /tmp/deep_mine_v09.b64
          base64 -d /tmp/deep_mine_v09.b64 > /tmp/deep_mine_v09.zip
          echo "973d7f59475f589bbd01a605b4294f97fa91e8560779c73861783ac0d6720183  /tmp/deep_mine_v09.zip" | sha256sum -c -

          rm -rf /tmp/deep-v09
          mkdir -p /tmp/deep-v09 android-web/app/src/main/assets
          rm -rf android-web/app/src/main/assets/*
          unzip -q /tmp/deep_mine_v09.zip -d /tmp/deep-v09
          cp -a /tmp/deep-v09/deep_mine_v09/. android-web/app/src/main/assets/

          test -f android-web/app/src/main/assets/index.html
          test -f android-web/app/src/main/assets/style.css
          test -f android-web/app/src/main/assets/game.js
          node --check android-web/app/src/main/assets/game.js
          grep -q 'Deep Mine v0.9' android-web/app/src/main/assets/index.html

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-web
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/DeepMine-v0.9.apk

      - name: Verify APK
        working-directory: android-web
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/DeepMine-v0.9.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'assets/game.js'
          unzip -p "$APK" assets/index.html | grep -q 'Deep Mine v0.9'
          /usr/local/lib/android/sdk/build-tools/35.0.1/apksigner verify "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepMine-v0.9-APK
          path: android-web/app/build/outputs/apk/debug/DeepMine-v0.9.apk
          if-no-files-found: error
          retention-days: 14
