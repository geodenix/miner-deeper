name: Build Life Zero v0.2 STABLE APK

on:
  push:
    branches: [ apk-build-v10 ]
    paths:
      - 'life_zero_v02/**'
      - '.github/workflows/build-night-courier-v01.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Restore permanent signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: deep-mine-web-debug-signing-v1
          fail-on-cache-miss: true

      - name: Verify signing key
        shell: bash
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | tr -d ':' | grep -qi '6C3334B90809F3B66186244A1DF1D642A462FBBC8FFF4BE3BDD35A4004C7008B'

      - name: Prepare Life Zero
        shell: bash
        run: |
          rm -rf android-web/app/src/main/assets
          mkdir -p android-web/app/src/main/assets
          base64 -d life_zero_v02/index.html.gz.b64 | gzip -d > android-web/app/src/main/assets/index.html
          echo "7bce69a26f3d3dc0bafda7c4275f7e1568482536a49df16efd9810ef9141ef69  android-web/app/src/main/assets/index.html" | sha256sum -c -

          cat > android-web/app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.VIBRATE"/>
            <application android:allowBackup="true" android:hardwareAccelerated="true"
              android:label="Жизнь с нуля" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
              <activity android:name="com.geodenix.deepmine.MainActivity" android:exported="true" android:screenOrientation="portrait"
                android:configChanges="keyboard|keyboardHidden|orientation|screenLayout|screenSize|smallestScreenSize|uiMode">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          XML

          cat > android-web/app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.geodenix.deepmine'
            compileSdk 35
            signingConfigs {
              debug {
                storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
              }
            }
            defaultConfig {
              applicationId "com.geodenix.lifezero"
              minSdk 24
              targetSdk 35
              versionCode 2
              versionName "0.2"
            }
            buildTypes { debug { minifyEnabled false; signingConfig signingConfigs.debug } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          GRADLE
          grep -q 'Жизнь с нуля v0.2' android-web/app/src/main/assets/index.html

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-web
        run: |
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/LifeZero-v0.2-STABLE.apk

      - name: Verify APK
        working-directory: android-web
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/LifeZero-v0.2-STABLE.apk"
          test -s "$APK"
          unzip -p "$APK" assets/index.html | grep -q 'Жизнь с нуля v0.2'
          /usr/local/lib/android/sdk/build-tools/35.0.1/aapt dump badging "$APK" | grep "package: name='com.geodenix.lifezero'" | grep "versionCode='2'" | grep "versionName='0.2'"
          VERIFY="$(/usr/local/lib/android/sdk/build-tools/35.0.1/apksigner verify --verbose --print-certs "$APK")"
          echo "$VERIFY"
          echo "$VERIFY" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
          echo "$VERIFY" | grep -qi '6c3334b90809f3b66186244a1df1d642a462fbbc8fff4be3bdd35a4004c7008b'

      - uses: actions/upload-artifact@v4
        with:
          name: LifeZero-v0.2-STABLE-APK
          path: android-web/app/build/outputs/apk/debug/LifeZero-v0.2-STABLE.apk
          if-no-files-found: error
          retention-days: 30
