name: Build GDevelop 3D Web

on:
  push:
    branches: [ main ]
    paths:
      - 'gdevelop3d/**'
      - '.github/workflows/build-gdevelop-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gdevelop-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GDevelop runtime dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libasound2t64 libgtk-3-0 libgbm1 libxss1 unzip curl

      - name: Download GDevelop 5.6.282
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/gdevelop-linux.zip \
            https://github.com/4ian/GDevelop/releases/download/v5.6.282/GDevelop-5-5.6.282-linux.zip
          mkdir -p /tmp/gdevelop
          unzip -q /tmp/gdevelop-linux.zip -d /tmp/gdevelop

      - name: Export project to HTML5
        shell: bash
        run: |
          GD_BIN="$(find /tmp/gdevelop -type f \( -name gdevelop -o -name GDevelop \) | head -n 1)"
          if [ -z "$GD_BIN" ]; then
            echo "GDevelop executable not found"
            exit 1
          fi
          chmod +x "$GD_BIN"
          rm -rf gdevelop3d/build
          xvfb-run -a "$GD_BIN" \
            --no-sandbox \
            --disable-update-check \
            --block-on-diagnostic-errors \
            --run-command EXPORT_HTML5_EXTERNAL \
            "$GITHUB_WORKSPACE/gdevelop3d/miner-deeper-gdevelop.json"
          test -f gdevelop3d/build/index.html

      - name: Bust browser cache for every build
        shell: bash
        run: |
          BUILD_ID="${GITHUB_SHA:0:12}"
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("gdevelop3d/build/index.html")
          s = p.read_text(encoding="utf-8")
          build = os.environ["GITHUB_SHA"][:12]
          s = re.sub(r'<script src="([^"]+)"', lambda m: f'<script src="{m.group(1)}?build={build}"', s)
          s = s.replace('<link rel="manifest" href="manifest.webmanifest">', f'<link rel="manifest" href="manifest.webmanifest?build={build}">')
          s = s.replace("<head>", f"<head>\n    <meta name=\"miner-deeper-build\" content=\"{build}\">")
          p.write_text(s, encoding="utf-8")
          PY
          echo "Published build id: $BUILD_ID"

      - name: Upload downloadable web build
        uses: actions/upload-artifact@v4
        with:
          name: miner-deeper-gdevelop3d-web
          path: gdevelop3d/build
          if-no-files-found: error
          retention-days: 14

      - name: Publish web build to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gdevelop3d/build
          publish_branch: gh-pages
          force_orphan: true
