name: Build Deep Mine v0.8 APK

on:
  push:
    branches: [ apk-build-v08 ]
    paths:
      - 'android-web/**'
      - 'webapp_v08/**'
      - '.github/workflows/build-web-v08-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: deep-mine-web-debug-signing-v1

      - name: Create debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Deep Mine Debug,O=geodenix,C=RU"               -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Rebuild Deep Mine v0.8 web files
        shell: bash
        run: |
          rm -rf /tmp/deep-v07 /tmp/deep-v08
          mkdir -p /tmp/deep-v07 /tmp/deep-v08

          cat webapp_v07/deep_mine_v07.zip.b64.part* > /tmp/deep_mine_v07.b64
          base64 -d /tmp/deep_mine_v07.b64 > /tmp/deep_mine_v07.zip
          unzip -q /tmp/deep_mine_v07.zip -d /tmp/deep-v07
          mv /tmp/deep-v07/deep_mine_v07 /tmp/deep-v08/deep_mine_v08

          cat webapp_v08/v08.patch.gz.b64.part* > /tmp/v08.patch.gz.b64
          base64 -d /tmp/v08.patch.gz.b64 | gzip -d > /tmp/v08.patch

          cd /tmp/deep-v08/deep_mine_v08
          patch -p1 < /tmp/v08.patch
          node --check game.js

          echo "96b64612a96752c89df74038d32a0eb7e2f7c22c39a9e69500cce7c0f123059b  index.html" | sha256sum -c -
          echo "424fe2f6ee0ddaf6f3aab82ba5a7e5f1eed9eb7c90b5bff85a158a39c19b514d  style.css" | sha256sum -c -
          echo "1e1e2196be1aced7cf5e73f7efb868488585f88ed0b604f7d95e39f826050283  game.js" | sha256sum -c -

          cd "$GITHUB_WORKSPACE"
          rm -rf android-web/app/src/main/assets/*
          cp -a /tmp/deep-v08/deep_mine_v08/. android-web/app/src/main/assets/
          test -f android-web/app/src/main/assets/index.html
          test -f android-web/app/src/main/assets/style.css
          test -f android-web/app/src/main/assets/game.js

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-web
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/DeepMine-v0.8.apk

      - name: Verify APK
        working-directory: android-web
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/DeepMine-v0.8.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'assets/game.js'
          unzip -p "$APK" assets/index.html | grep -q 'Deep Mine v0.8'
          /usr/local/lib/android/sdk/build-tools/35.0.1/apksigner verify "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepMine-v0.8-APK
          path: android-web/app/build/outputs/apk/debug/DeepMine-v0.8.apk
          if-no-files-found: error
          retention-days: 14
