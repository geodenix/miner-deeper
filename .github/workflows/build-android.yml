name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: miner-deeper-debug-signing-v1

      - name: Create debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Android Debug,O=Android,C=US"               -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Export Godot project
        id: export
        uses: firebelley/godot-export@v8.0.0
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./game
          presets_to_export: Android
          export_debug: true
          cache: true
          verbose: true

      - name: Smoke test game startup
        shell: bash
        run: |
          GODOT_BIN="/home/runner/.local/share/godot/godot_executable/Godot_v4.7.2-stable_linux.x86_64"
          set +e
          "$GODOT_BIN" --headless --path game --quit-after 10 2>&1 | tee smoke.log
          RC=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR|Parse Error|Invalid access|ERROR:" smoke.log; then
            echo "Runtime/startup error detected"
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            exit "$RC"
          fi

      - name: Show exported files
        shell: bash
        run: |
          echo "Build directory: ${{ steps.export.outputs.build_directory }}"
          find "${{ steps.export.outputs.build_directory }}" -maxdepth 3 -type f -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: miner-deeper-v1.0-rail-logistics-apk
          path: ${{ steps.export.outputs.build_directory }}/**/*.apk
          if-no-files-found: error
          retention-days: 14
