plugins {
    id 'com.android.application'
}

android {
    namespace 'com.geodenix.deepmine'
    compileSdk 35

    defaultConfig {
        applicationId "com.geodenix.deepmine"
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
